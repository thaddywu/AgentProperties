[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-translation"
version = "0.1.0"
description = "Independent policy requirement, rule and back-translation pipeline"
requires-python = ">=3.10"
dependencies = ["policy-runtime>=0.1.0"]

[project.scripts]
policy-translate = "policy_translation.__main__:main"

[tool.setuptools.packages.find]
include = ["policy_translation*"]

[tool.setuptools.package-data]
policy_translation = ["*.md"]
