name: PolicyWeave
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native engine and Python distribution
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/policyweave-cache" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/policyweave-state" >> "$GITHUB_ENV"
          python -m pip install '.[mcp,test]' build
          python -B -m policyweave.adapters.install_souffle --directory "$RUNNER_TEMP/souffle"
          echo "$RUNNER_TEMP/souffle/usr/bin" >> "$GITHUB_PATH"
      - name: Offline verification
        run: |
          souffle --version
          python -B -m tests
          python -B -m unittest discover -s docs/course -p 'test_*.py'
          python examples/quickstart/quickstart.py
          python -m build --outdir "$RUNNER_TEMP/distributions"
      - name: Verify installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          policyweave --help
          policyweave port --help
          policyweave add --help
          policyweave view-translation --help
          policyweave translate --help
          policyweave backtranslate --help
          policyweave review --help
          policyweave enforce --help
          policyweave analyze --help
          policyweave inspect --help
          policyweave run-cases --help
          python - <<'PY'
          from policyweave.workbench.example import Application
          events = []
          result = Application().run({"setup": {"actor": "alice", "document": "doc-b", "state": "active"}}, "protected", 42, events.append)
          assert events[0]["outcome"] == "blocked"
          assert result["completed"] is False
          PY
      - name: Sandbox engine self-check
        run: |
          docker build -f src/policyweave/adapters/Dockerfile -t policy-portin:local .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp --entrypoint python policy-portin:local -c 'from policyweave.core.datalog import Souffle, parse; rules, _ = parse("Ready(X) :- Probe(X)."); assert Souffle().evaluate([{"predicate": "Probe", "args": ["c:ready"]}], rules); print("Native engine ready")'
      - name: Headless review journeys
        run: |
          python -m playwright install --with-deps chromium
          python tests/workbench/ui_smoke.py
          python tests/workbench/codex_ui_smoke.py
          python tests/workbench/student_ui_smoke.py
          python tests/workbench/analysis_ui_smoke.py
          python tests/workbench/remote_ui_smoke.py
          python tests/workbench/experiment_ui_smoke.py
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: policy-review
          path: ${{ runner.temp }}/policyweave-cache/policyweave/test-results/
          if-no-files-found: ignore
