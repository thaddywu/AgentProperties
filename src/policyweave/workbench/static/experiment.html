<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment</title><link rel="stylesheet" href="/experiment.css"><script type="module" src="/experiment.js"></script></head><body>
<header><div><span class="eyebrow">PAIRED EXECUTION</span><h1 id="study-title">Study</h1></div><p id="job-status" role="status" aria-live="polite"></p></header>
<p id="error" role="alert"></p>
<main><nav id="cases" aria-label="Test cases"></nav><section id="case-panel"><h2 id="case-title"></h2><p id="task"></p><details><summary>Expected outcome</summary><p id="expected"></p></details>
<div class="controls"><label for="repetitions">Repetitions</label><select id="repetitions"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select><button id="run">Run pair</button></div>
<div id="results"></div>
<details class="scope"><summary>Assessment scope</summary><p id="assessment-scope"></p></details>
</section></main></body></html>
