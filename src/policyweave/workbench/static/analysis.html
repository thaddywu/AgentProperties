<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trajectory</title>
  <link rel="stylesheet" href="/analysis.css">
  <script type="module" src="/analysis.js"></script>
</head>
<body>
  <header>
    <div class="brand" aria-label="PolicyWeave"><span class="brand-mark" aria-hidden="true">P</span><span>PolicyWeave</span><span class="header-divider"></span><span class="workspace-name">Inspector</span></div>
    <div class="actions"><button id="theme" type="button" aria-label="Toggle theme" aria-pressed="false">◐</button><button id="open-log" type="button">Open</button><input id="file" type="file" accept=".json,.jsonl,application/json,application/x-ndjson"><a id="export" class="button quiet" href="/api/analysis/export" download="trajectory.json" hidden>Export</a></div>
  </header>
  <dialog id="log-picker" aria-labelledby="log-picker-title"><div class="dialog-heading"><h2 id="log-picker-title">Open trajectory</h2><button id="close-picker" type="button" aria-label="Close">×</button></div><label class="sr-only" for="log-search">Search server logs</label><input id="log-search" type="search" placeholder="Search server logs"><div id="server-logs" role="group" aria-label="Server logs"></div><p id="picker-status" class="subtle" role="status"></p><button id="upload-log" type="button">Upload from this device</button></dialog>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="empty" hidden>Open a trajectory JSON file.</div>
  <main id="workspace" hidden>
    <aside class="participants"><div class="sidebar-label">Agents</div><div id="roles"></div></aside>
    <section class="stream" aria-label="Timeline">
      <div class="filters"><label class="sr-only" for="kind">Kind</label><select id="kind" aria-label="Kind"><option value="">All activity</option></select><label class="search"><span class="sr-only">Search events</span><input id="search-events" type="search" placeholder="Search events" aria-label="Search events"></label><label class="toggle"><input id="all-events" type="checkbox">All events</label></div>
      <div class="scrubber"><label for="position"><output id="position-value">—</output></label><input id="position" type="range" min="0" max="0" value="0" step="1" aria-label="Event position"></div>
      <div id="events"></div>
      <p id="no-events" hidden>No matching events.</p>
    </section>
    <section class="inspector" aria-label="Event details">
      <div class="inspector-heading"><strong>Inspector</strong></div>
      <nav class="inspector-tabs" role="tablist" aria-label="Inspector views"><button id="tab-details" role="tab" aria-selected="true" aria-controls="detail" data-tab="details">Details</button><button id="tab-qa" role="tab" aria-selected="false" aria-controls="analysis-tools" data-tab="qa">QA</button><button id="tab-evidence" role="tab" aria-selected="false" aria-controls="evidence-panel" data-tab="evidence">Evidence</button></nav>
      <div class="inspector-body">
      <div id="detail" role="tabpanel" aria-labelledby="tab-details"></div>
      <section id="evidence-panel" role="tabpanel" aria-labelledby="tab-evidence" hidden><h2 class="database-heading">Database</h2><div class="snapshot-controls"><div id="snapshot-phase" class="segmented"><button type="button" data-phase="before" aria-pressed="true">Before</button><button type="button" data-phase="after" aria-pressed="false">After</button></div></div><p id="fact-status" class="subtle" role="status"></p><div id="facts"></div></section>
      <section id="analysis-tools" role="tabpanel" aria-labelledby="tab-qa" hidden>
        <p id="call-context" class="analysis-context"></p>
        <div id="call-suggestions" class="question-suggestions" role="group" aria-label="Questions"></div>
        <form id="call-form"><p id="call-question" class="content"></p><button id="analyze-call" type="submit" disabled>Analysis</button></form>
        <p id="call-status" class="subtle" role="status" aria-live="polite"></p>
        <div id="call-answer" aria-live="polite"></div>

      </section>
      </div>
    </section>
  </main>
</body>
</html>
