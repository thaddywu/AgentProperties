[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-runtime"
version = "0.1.0"
description = "Provider-neutral registered action gate backed by native Souffle"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["policy_runtime*"]

[tool.setuptools.package-data]
policy_runtime = ["foundations.json"]
