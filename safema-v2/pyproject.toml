[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safema-prototype-v2"
version = "0.2.0"
description = "Policy-directed runtime mediation with trusted live state and exact numeric predicates"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
safema-register-resource = "safema.control_plane:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["safema*"]
