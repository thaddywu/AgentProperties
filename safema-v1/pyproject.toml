[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safema-prototype"
version = "0.1.0"
description = "Policy-directed runtime mediation prototype"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
safema-recsub = "safema.recsub_runner:main"
safema-register-resource = "safema.control_plane:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["safema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
