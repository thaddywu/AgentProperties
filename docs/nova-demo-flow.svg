<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">Nova demo pipeline</title>
  <desc id="description">Nova Application flows to Translation Module, then Generated Datalog. It branches to Runtime Enforcement and Query Module, producing Allow or Reject and Analysis Results.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="900" height="560" rx="24" fill="#fafafa"/>
  <g fill="none" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)">
    <path d="M450 96 V134"/>
    <path d="M450 204 V242"/>
    <path d="M450 312 V345 H230 V379"/>
    <path d="M450 312 V345 H670 V379"/>
    <path d="M230 449 V487"/>
    <path d="M670 449 V487"/>
  </g>
  <g stroke="#d4d4d8" stroke-width="1.5" fill="white">
    <rect x="290" y="26" width="320" height="70" rx="14"/>
    <rect x="290" y="134" width="320" height="70" rx="14"/>
    <rect x="290" y="242" width="320" height="70" rx="14" fill="#18181b" stroke="#18181b"/>
    <rect x="60" y="379" width="340" height="70" rx="14"/>
    <rect x="500" y="379" width="340" height="70" rx="14"/>
    <rect x="100" y="487" width="260" height="48" rx="24" fill="#f4f4f5"/>
    <rect x="540" y="487" width="260" height="48" rx="24" fill="#f4f4f5"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#27272a" text-anchor="middle" dominant-baseline="middle">
    <text x="450" y="61">Nova Application</text>
    <text x="450" y="169">Translation Module</text>
    <text x="450" y="277" fill="white">Generated Datalog</text>
    <text x="230" y="414">Runtime Enforcement</text>
    <text x="670" y="414">Query Module</text>
    <text x="230" y="511" font-size="19">Allow / Reject</text>
    <text x="670" y="511" font-size="19">Analysis Results</text>
  </g>
</svg>
