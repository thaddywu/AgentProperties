[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-query"
version = "0.1.0"
description = "Read-only policy snapshots, questions and hypothetical checks"
requires-python = ">=3.10"
dependencies = ["policy-runtime>=0.1.0"]

[project.scripts]
policy-query = "policy_query.__main__:main"

[tool.setuptools.packages.find]
include = ["policy_query*"]
